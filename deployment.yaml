apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-python-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trivy-python-app
  template:
    metadata:
      labels:
        app: trivy-python-app
    spec:
      containers:
      - name: trivy-python-container
        image: trivy-python-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000